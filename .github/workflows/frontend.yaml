name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yaml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yaml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build bundles
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build and check the Python package
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir wheel python
          python -m pip install wheel/*.whl
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/frontend/python/tests/test_package.py" -v

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/dist
            frontend/wheel
